name: Release Dragon Sample App

# Tagging sample-vX.Y.Z (kept separate from the library's vX.Y.Z tags) builds, signs,
# notarizes and publishes the Dragon Sample App: a GitHub Release on this repo, a signed
# Sparkle appcast committed to THIS repo (docs/dragon-sample-app/appcast.xml, served via
# raw.githubusercontent — the marketing site is not involved), and a Homebrew cask bump in
# teddychan/homebrew-tap. Thin caller of the shared reusable workflow.
#
# This repo's releases belong to DragonKit itself (the vX.Y.Z tags). The sample app is only a
# reference app that happens to be built from this repo, so its releases are demoted to
# pre-release in the `mark-prerelease` job below — otherwise the newest sample-v* would take
# the "Latest" badge and misreport what version the *kit* is at. The shared reusable workflow
# has no prerelease input, so it is done here after the fact.
on:
  push:
    tags:
      - 'sample-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: teddychan/dragon-release-ci/.github/workflows/release-macos.yml@v5
    secrets: inherit
    with:
      build_kind: swiftpm
      app_slug: dragon-sample-app
      appcast_repo: teddychan/dragon-kit
      swiftpm_working_directory: sample-app
      swiftpm_product_name: DragonAppTemplate
      swiftpm_app_name_template: 'Dragon Sample App'
      swiftpm_sparkle: true
      swiftpm_runner: macos-26
      assert_tag_matches_plist: true
      zip_name_template: 'DragonSampleApp-{TAG}.zip'
      generate_appcast_glob: swiftpm
      bot_name: Dragon Sample Release Bot
      release_title_prefix: ''

  # Demote the release the job above just published, so the kit's own vX.Y.Z releases keep the
  # "Latest" badge. The assets stay downloadable, so the Sparkle appcast and the
  # dragon-sample-app Homebrew cask — both of which link straight to the asset URL — keep working.
  mark-prerelease:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sample-v')
    permissions:
      contents: write
    steps:
      - name: Mark the sample app release as a pre-release
        env:
          # Via env, never interpolated into the run: script — a tag name is attacker-shaped input.
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$REPO" --prerelease
